# `nthChild: 6` asserts a sixth parameter node exists, i.e. more than five.
# Go reuses parameter_list for named results, so the Go variant is pinned to the
# `parameters` field; grouped Go params (`a, b int`) count as one node.
id: max-params
language: TypeScript
severity: warning
message: "More than 5 parameters — group the related ones into an options object."
rule:
  kind: formal_parameters
  has:
    nthChild: 6

