---
id: max-params-go
language: Go
severity: warning
message: "More than 5 parameters — group the related ones into a struct."
rule:
  all:
    - kind: parameter_list
    - inside:
        stopBy: neighbor
        field: parameters
        any:
          - kind: function_declaration
          - kind: method_declaration
          - kind: func_literal
    - has:
        nthChild: 6

