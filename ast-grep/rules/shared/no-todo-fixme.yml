# TODO/FIXME/HACK/XXX markers, reported as hints so they surface without
# competing with real defects.
id: no-todo-fixme
language: TypeScript
severity: hint
message: "Unresolved marker in a comment — resolve it or move it to the issue tracker."
rule:
  kind: comment
  regex: \b(TODO|FIXME|HACK|XXX)\b

